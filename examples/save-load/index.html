<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenMarkdown editor: save and load</title>
    <style>
      #bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; font: 14px system-ui, sans-serif; }
      #status[data-identical="true"] { color: #1f8a5b; }
      #editor { height: 340px; border: 1px solid #d9d6cf; border-radius: 8px; overflow: hidden; }
      #editor .cm-editor { height: 100%; }
    </style>
  </head>
  <body>
    <div id="bar">
      <label>Open a .md file <input id="open" type="file" accept=".md,.markdown,text/markdown,text/plain" /></label>
      <button id="save" type="button">Save</button>
      <output id="status" data-identical="true"></output>
    </div>
    <div id="editor"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
