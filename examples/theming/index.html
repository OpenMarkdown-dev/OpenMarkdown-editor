<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenMarkdown editor: theming</title>
    <style>
      #scheme { margin-bottom: 10px; font: 14px system-ui, sans-serif; }
      #editor { height: 340px; border: 1px solid #d9d6cf; border-radius: 8px; overflow: hidden; }
      #editor .cm-editor { height: 100%; }
      /* Restyle through the --ome-* tokens, set on .cm-editor. */
      #editor .cm-editor {
        --ome-accent: #7c3aed;
        --ome-font: Georgia, "Times New Roman", serif;
        --ome-radius: 10px;
      }
    </style>
  </head>
  <body>
    <button id="scheme" type="button">Dark</button>
    <div id="editor"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
