# Contributor License Agreement check (CLA Assistant Lite).
#
# Every pull request author must sign CLA.md once, by commenting the sentence
# below on the pull request. Signatures are stored as JSON on the
# `cla-signatures` branch of this repository. Maintainers listed in
# `allowlist` are exempt.
#
# Security: `pull_request_target` runs with this repository's token, so this
# workflow never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document v1.0 and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/OpenMarkdown-dev/OpenMarkdown-editor/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: "XueyanZhang,dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: >-
            Thank you for the pull request! Before we can merge it, please read the
            [Contributor License Agreement](https://github.com/OpenMarkdown-dev/OpenMarkdown-editor/blob/main/CLA.md)
            and sign it by commenting the sentence below. You only sign once.
          custom-pr-sign-comment: "I have read the CLA Document v1.0 and I hereby sign the CLA"
          lock-pullrequest-aftermerge: false
